<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo thiệp online | Thiệp Cưới Minh Đạo</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><nav class="container nav"><a class="brand" href="index.html"><span class="brand-mark">MĐ</span><span><strong>Thiệp Cưới Minh Đạo</strong></span></a><div class="nav-actions" style="margin-left:auto"><a class="btn outline" href="online.html">Thoát trình tạo</a></div></nav></header><main class="builder-shell"><form class="builder-panel" id="invitationBuilder"><div class="builder-top"><div><div class="eyebrow">Trình tạo thiệp</div><h1>Thông tin lời mời</h1></div><span class="muted" id="saveState">Tự động lưu</span></div>
<section class="builder-section"><h2>1. Chọn phong cách</h2><div class="theme-options"><button type="button" class="theme-option active" data-theme="assets/cards/hd-548-tn-548.jpg"><img src="assets/cards/hd-548-tn-548.jpg" alt="Mẫu hoa"></button><button type="button" class="theme-option" data-theme="assets/cards/hd-800-tn-800.jpg"><img src="assets/cards/hd-800-tn-800.jpg" alt="Mẫu hiện đại"></button><button type="button" class="theme-option" data-theme="assets/cards/tn-147.jpg"><img src="assets/cards/tn-147.jpg" alt="Mẫu tối giản"></button></div></section>
<section class="builder-section"><h2>2. Thông tin hai bạn</h2><div class="builder-fields"><div class="field"><label for="groom">Tên chú rể</label><input id="groom" name="groom" value="Minh"></div><div class="field"><label for="bride">Tên cô dâu</label><input id="bride" name="bride" value="Lan"></div><div class="field full"><label for="message">Lời nhắn đầu thiệp</label><textarea id="message" name="message">Trân trọng mời bạn đến chung vui trong ngày hạnh phúc của chúng mình.</textarea></div></div></section>
<section class="builder-section"><h2>3. Thời gian & địa điểm</h2><div class="builder-fields"><div class="field"><label for="date">Ngày cưới</label><input id="date" name="date" type="date"></div><div class="field"><label for="time">Giờ đón khách</label><input id="time" name="time" type="time" value="17:30"></div><div class="field full"><label for="venue">Tên địa điểm</label><input id="venue" name="venue" placeholder="Nhập tên nhà hàng hoặc tư gia"></div><div class="field full"><label for="address">Địa chỉ</label><input id="address" name="address" placeholder="Nhập địa chỉ tổ chức"></div></div></section>
<div class="builder-actions"><button class="btn" type="button" id="shareInvite">Tạo đường dẫn chia sẻ</button><button class="btn outline" type="button" id="previewInvite">Mở thiệp</button></div><div class="share-box" id="shareBox"></div></form>
<div class="builder-stage"><div class="invite-frame"><section class="invite-cover" id="previewCover"><div class="invite-kicker">Save the date</div><div class="invite-names"><span id="previewGroom">Minh</span><br>&<br><span id="previewBride">Lan</span></div><div class="invite-date" id="previewDate">Ngày cưới của chúng mình</div></section><section class="invite-section"><div class="eyebrow">Lời mời</div><h2>Trân trọng kính mời</h2><p class="muted" id="previewMessage"></p><div class="event-box"><b id="previewVenue">Địa điểm sẽ được cập nhật</b><p class="muted" id="previewAddress"></p><p id="previewTime"></p></div></section></div></div></main><script src="online.js"></script></body></html>
